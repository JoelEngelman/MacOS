<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacOS Desktop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="desktop" class="desktop">
  <header class="menubar">
    <div class="menu-left">
      <button class="apple-menu" aria-label="Apple menu"></button>
      <span id="activeApp" class="active-app">Finder</span>
      <span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="menu-right">
      <button id="network" class="status-button" aria-label="Network"><svg viewBox="0 0 24 24"><path d="M2.5 9.5a15 15 0 0 1 19 0M5.5 13a10.5 10.5 0 0 1 13 0M8.5 16.5a6 6 0 0 1 7 0M12 20h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="searchButton" class="status-button" aria-label="Spotlight"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="battery" class="status-button battery-icon" aria-label="Battery"><span></span></button>
      <span id="clock" class="menu-clock"></span>
    </div>
  </header>

  <section class="desktop-icons">
    <div class="desktop-icon" data-open="finder"><div class="icon"><svg viewBox="0 0 64 64"><path d="M5 16h20l5 6h29v28H5z" fill="#55a9ff"/><path d="M5 16h20l5 6H5z" fill="#7bc1ff"/></svg></div><span>Macintosh HD</span></div>
    <div class="desktop-icon" data-open="trash"><div class="icon"><svg viewBox="0 0 64 64"><path d="M14 18h36l-3 40H17z" fill="#aaa"/><path d="M11 13h42M25 8h14v5" stroke="#777" stroke-width="5"/></svg></div><span>Trash</span></div>
  </section>

  <div id="windows"></div>
  <section id="launchpad" class="launchpad"><h1>Applications</h1><div id="launchGrid" class="launch-grid"></div></section>
  <section id="spotlight" class="spotlight"><div class="spotlight-box"><div class="spotlight-input-wrap"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="spotInput" placeholder="Spotlight Search" autocomplete="off"></div><div id="spotResults" class="spot-results"></div></div></section>
  <aside id="controlCenter" class="control-center"><div class="cc-grid"><div class="cc-card"><b>Connectivity</b><div>Wi-Fi <strong>On</strong></div><div>Bluetooth <strong>On</strong></div></div><div class="cc-card"><b>Display</b><div>Brightness</div><input id="brightness" class="cc-slider" type="range" min="20" max="100" value="80"></div><div class="cc-card"><b>Sound</b><input id="volume" class="cc-slider" type="range" min="0" max="100" value="70"></div><div class="cc-card"><b>Appearance</b><button id="darkToggle">Dark mode</button></div></div></aside>
  <aside id="notifications" class="notification-center"><h2>Notifications</h2><div class="notification"><b>MacOS Desktop</b><br>Welcome to your desktop.</div><div class="notification"><b>System</b><br>Your simulated Mac is ready.</div></aside>
  <div id="contextMenu" class="context-menu"><div data-action="new-folder">New Folder</div><div data-action="new-note">New Note</div><div data-action="finder">Open Finder</div><div data-action="settings">System Settings…</div><div data-action="wallpaper">Change Wallpaper</div></div>
  <div id="toast" class="toast"></div>

  <footer id="dock" class="dock">
    <div class="dock-item" data-app="finder" title="Finder"><svg viewBox="0 0 64 64"><path d="M5 16h20l5 6h29v28H5z" fill="#55a9ff"/><path d="M5 16h20l5 6H5z" fill="#7bc1ff"/></svg></div>
    <div class="dock-item" data-app="launchpad" title="Launchpad"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#777"/><circle cx="22" cy="22" r="4" fill="#fff"/><circle cx="42" cy="22" r="4" fill="#fff"/><circle cx="22" cy="42" r="4" fill="#fff"/><circle cx="42" cy="42" r="4" fill="#fff"/></svg></div>
    <div class="dock-item" data-app="settings" title="System Settings"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="#858585"/><circle cx="32" cy="32" r="8" fill="#eee"/><path d="M32 5v10M32 49v10M5 32h10M49 32h10M13 13l7 7M44 44l7 7M51 13l-7 7M20 44l-7 7" stroke="#eee" stroke-width="6" stroke-linecap="round"/></svg></div>
    <div class="dock-item" data-app="browser" title="Safari"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#3e9bf4"/><circle cx="32" cy="32" r="10" fill="#fff"/><path d="M32 6v16M32 42v16M6 32h16M42 32h16" stroke="#fff" stroke-width="3"/></svg></div>
    <div class="dock-item" data-app="messages" title="Messages"><svg viewBox="0 0 64 64"><path d="M8 10h48v35H29L17 55v-10H8z" fill="#35c759"/><circle cx="23" cy="27" r="3" fill="#fff"/><circle cx="32" cy="27" r="3" fill="#fff"/><circle cx="41" cy="27" r="3" fill="#fff"/></svg></div>
    <div class="dock-item" data-app="music" title="Music"><svg viewBox="0 0 64 64"><rect x="8" y="7" width="48" height="50" rx="9" fill="#d34d79"/><circle cx="24" cy="44" r="7" fill="#fff"/><circle cx="44" cy="39" r="7" fill="#fff"/><path d="M31 43V17l21-5v27" stroke="#fff" stroke-width="5" fill="none"/></svg></div>
    <div class="dock-item" data-app="photos" title="Photos"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="#fff" stroke="#bbb"/><path d="M32 8v48M8 32h48M15 15l34 34M49 15 15 49" stroke="#559bd0" stroke-width="5"/></svg></div>
    <div class="dock-item" data-app="notes" title="Notes"><svg viewBox="0 0 64 64"><rect x="9" y="5" width="46" height="54" rx="6" fill="#fff"/><path d="M9 18h46" stroke="#e44" stroke-width="3"/><path d="M17 28h30M17 37h25M17 46h20" stroke="#aaa" stroke-width="3"/></svg></div>
    <div class="dock-item" data-app="calculator" title="Calculator"><svg viewBox="0 0 64 64"><rect x="7" y="5" width="50" height="54" rx="8" fill="#333"/><rect x="13" y="11" width="38" height="12" rx="3" fill="#111"/><path d="M15 31h34M15 41h34M15 51h34M25 27v28M39 27v28" stroke="#888" stroke-width="3"/></svg></div>
    <div class="dock-item" data-app="terminal" title="Terminal"><svg viewBox="0 0 64 64"><rect x="5" y="8" width="54" height="48" rx="8" fill="#242424"/><path d="m15 24 10 8-10 8M30 42h19" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
    <div class="dock-sep"></div>
    <div class="dock-item" data-app="trash" title="Trash"><svg viewBox="0 0 64 64"><path d="M14 18h36l-3 40H17z" fill="#aaa"/><path d="M11 13h42M25 8h14v5" stroke="#777" stroke-width="5"/></svg></div>
  </footer>
</main>
<script src="renderer.js"></script>
<script>
  document.querySelectorAll('.desktop-icon[data-open]').forEach(el=>el.addEventListener('dblclick',()=>window.openApp&&window.openApp(el.dataset.open)));
  document.querySelectorAll('#dock .dock-item[data-app]').forEach(el=>el.addEventListener('click',()=>window.openApp&&window.openApp(el.dataset.app)));
</script>
</body>
</html>
