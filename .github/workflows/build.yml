name: Build MacOS Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node for CI
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-Desktop-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: MacOS-Desktop-Windows
          path: release
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v2.0.0"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "MacOS Desktop $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" release/*.exe release/*.blockmap --repo "$GITHUB_REPOSITORY" --clobber
